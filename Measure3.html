<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo QS - Measure</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
  .banner { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
  .banner.error { background: #2d0d0d; border: 1px solid #ff4d4d; color: #ffb3b3; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px 0; color: #58a6ff; }
  label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 4px; margin-top: 10px; }
  input, select { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 15px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  button { width: 100%; padding: 12px; margin-top: 16px; background: #238636; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; }
  button.secondary { background: #21262d; border: 1px solid #30363d; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 500; font-size: 11px; text-transform: uppercase; }
  .qty { color: #7ee787; font-weight: 600; }
  .source-tag { font-size: 10px; padding: 2px 6px; border-radius: 10px; background: #30363d; color: #8b949e; }
  .source-tag.import { background: #1f3a5f; color: #79c0ff; }
  .empty-state { text-align: center; color: #6e7681; padding: 20px; font-size: 13px; }
  .status { font-size: 12px; margin-top: 8px; padding: 8px; border-radius: 6px; display: none; }
  .status.success { background: #0d2818; color: #7ee787; display: block; }
  .status.error { background: #2d0d0d; color: #ff7b72; display: block; }
  .table-scroll { overflow-x: auto; }
</style>
</head>
<body>

<h1>Neo QS — Measure</h1>
<div class="subtitle">Measurement Sheet · manual entry + PlanSwift CSV import</div>
<div class="banner error" id="errorBanner"></div>

<div class="card">
  <h2>Manual Entry</h2>
  <label>Description</label>
  <input type="text" id="description" placeholder="e.g. Excavate foundation trench">
  <label>NRM2 Category</label>
  <input type="text" id="nrm2_category" placeholder="e.g. Groundworks">
  <div class="row3">
    <div><label>Length (m)</label><input type="number" step="any" id="length"></div>
    <div><label>Width (m)</label><input type="number" step="any" id="width"></div>
    <div><label>Height (m)</label><input type="number" step="any" id="height"></div>
  </div>
  <label>Unit</label>
  <select id="unit">
    <option value="m3">m³ (cubic metres)</option>
    <option value="m2">m² (square metres)</option>
    <option value="m">m (linear metres)</option>
    <option value="nr">nr (number/count)</option>
    <option value="kg">kg</option>
    <option value="item">item</option>
  </select>
  <label>Quantity (auto-calculated if dimensions given, or enter manually)</label>
  <input type="number" step="any" id="quantity" placeholder="Leave blank to auto-calculate">
  <button onclick="addMeasurementItem()">Add to Measurement Sheet</button>
  <div class="status" id="manualStatus"></div>
</div>

<div class="card">
  <h2>PlanSwift CSV Import</h2>
  <label>Upload PlanSwift export (.csv)</label>
  <input type="file" id="csvFile" accept=".csv" style="margin-top:10px;">
  <button class="secondary" onclick="importCSV()">Import to Measurement Sheet</button>
  <div class="status" id="importStatus"></div>
</div>

<div class="card">
  <h2>Measurement Sheet</h2>
  <div class="table-scroll">
    <table>
      <thead><tr><th>Description</th><th>Unit</th><th>Qty</th><th>Source</th><th></th></tr></thead>
      <tbody id="sheetBody"><tr><td colspan="4" class="empty-state">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
  // No external library needed - talks directly to Supabase's REST API
  const SUPABASE_URL = "https://krnhvacnsluescndjobp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_qJsuE50avRGjP44LddactA_C86KRBC_";
  let currentProjectId = null;

  function showError(msg) {
    const b = document.getElementById('errorBanner');
    b.style.display = 'block';
    b.textContent = '⚠️ ' + msg;
  }

  function showStatus(elId, type, msg) {
    const el = document.getElementById(elId);
    el.className = 'status ' + type;
    el.textContent = msg;
    setTimeout(() => { el.style.display = 'none'; }, 5000);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function calcQuantity(unit, length, width, height) {
    const l = parseFloat(length), w = parseFloat(width), h = parseFloat(height);
    if (unit === 'm3' && l && w && h) return l * w * h;
    if (unit === 'm2' && l && w) return l * w;
    if (unit === 'm' && l) return l;
    return null;
  }

  async function supaGet(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  async function supaPost(path, body, preferReturn) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': preferReturn ? 'return=representation' : 'return=minimal'
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(await res.text());
    return preferReturn ? res.json() : null;
  }

  async function supaDelete(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    });
    if (!res.ok) throw new Error(await res.text());
  }

  async function deleteItem(id) {
    if (!confirm('Delete this item?')) return;
    try {
      await supaDelete(`measurement_items?id=eq.${id}`);
      loadMeasurementItems();
    } catch (e) {
      alert('Delete failed: ' + e.message);
    }
  }
    try {
      const existing = await supaGet('projects?select=id&limit=1');
      if (existing && existing.length > 0) {
        currentProjectId = existing[0].id;
      } else {
        const created = await supaPost('projects', { name: 'My First Project' }, true);
        currentProjectId = created[0].id;
      }
    } catch (e) {
      showError('Could not connect to Supabase: ' + e.message);
    }
  }

  async function loadMeasurementItems() {
    if (!currentProjectId) return;
    const tbody = document.getElementById('sheetBody');
    try {
      const data = await supaGet(`measurement_items?select=*&project_id=eq.${currentProjectId}&order=created_at.desc`);
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No items yet — add one above.</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(item => `
        <tr>
          <td>${escapeHtml(item.description)}</td>
          <td>${escapeHtml(item.unit)}</td>
          <td class="qty">${Number(item.quantity).toFixed(2)}</td>
          <td><span class="source-tag ${item.source === 'planswift_import' ? 'import' : ''}">${item.source === 'planswift_import' ? 'PlanSwift' : 'Manual'}</span></td>
          <td><button class="delete-btn" onclick="deleteItem('${item.id}')" style="width:auto;padding:4px 10px;margin:0;background:#5c1414;font-size:12px;">✕</button></td>
        </tr>`).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Error: ${e.message}</td></tr>`;
    }
  }

  async function addMeasurementItem() {
    if (!currentProjectId) { showStatus('manualStatus', 'error', 'Not connected yet.'); return; }
    const description = document.getElementById('description').value.trim();
    const nrm2_category = document.getElementById('nrm2_category').value.trim();
    const length = document.getElementById('length').value;
    const width = document.getElementById('width').value;
    const height = document.getElementById('height').value;
    const unit = document.getElementById('unit').value;
    let quantity = document.getElementById('quantity').value;
    if (!description) { showStatus('manualStatus', 'error', 'Description is required.'); return; }
    if (!quantity) {
      const calc = calcQuantity(unit, length, width, height);
      if (calc !== null) { quantity = calc; }
      else { showStatus('manualStatus', 'error', 'Enter a quantity or dimensions.'); return; }
    }
    try {
      await supaPost('measurement_items', {
        project_id: currentProjectId, description, nrm2_category: nrm2_category || null,
        unit, length: length || null, width: width || null, height: height || null,
        quantity: parseFloat(quantity), source: 'manual'
      }, false);
      showStatus('manualStatus', 'success', 'Added to Measurement Sheet.');
      ['description','nrm2_category','length','width','height','quantity'].forEach(id => document.getElementById(id).value = '');
      loadMeasurementItems();
    } catch (e) {
      showStatus('manualStatus', 'error', 'Error: ' + e.message);
    }
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
    return lines.slice(1).map(line => {
      const vals = line.split(',');
      const row = {};
      headers.forEach((h, idx) => row[h] = (vals[idx] || '').trim());
      return row;
    });
  }

  async function importCSV() {
    if (!currentProjectId) { showStatus('importStatus', 'error', 'Not connected yet.'); return; }
    const fileInput = document.getElementById('csvFile');
    if (!fileInput.files.length) { showStatus('importStatus', 'error', 'Choose a CSV file first.'); return; }
    const text = await fileInput.files[0].text();
    const rows = parseCSV(text);
    if (rows.length === 0) { showStatus('importStatus', 'error', 'No rows found.'); return; }
    const items = rows.map(r => ({
      project_id: currentProjectId,
      description: r.description || r.item || 'Imported item',
      nrm2_category: r.category || r.nrm2_category || null,
      unit: r.unit || 'item',
      quantity: parseFloat(r.quantity || r.qty || 0),
      source: 'planswift_import'
    })).filter(i => i.quantity > 0);
    if (items.length === 0) { showStatus('importStatus', 'error', 'No valid quantity data found.'); return; }
    try {
      await supaPost('measurement_items', items, false);
      showStatus('importStatus', 'success', `Imported ${items.length} item(s).`);
      fileInput.value = '';
      loadMeasurementItems();
    } catch (e) {
      showStatus('importStatus', 'error', 'Import error: ' + e.message);
    }
  }

  async function init() {
    await ensureProject();
    await loadMeasurementItems();
  }

  init();
</script>

</body>
</html>
